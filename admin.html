<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#080604">

  <title>SHORASH — Admin Dashboard</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at top, #21170d 0%, #0c0906 38%, #050403 100%);
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;
      min-height: 100vh;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       Header
       ========================= */

    .admin-header {
      padding: 28px 18px 22px;
      text-align: center;
      border-bottom: 1px solid rgba(201, 153, 76, 0.18);
      background: rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .admin-logo {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(218, 171, 92, 0.55);
      box-shadow:
        0 0 0 6px rgba(218, 171, 92, 0.04),
        0 12px 35px rgba(0, 0, 0, 0.5);
    }

    .admin-header h1 {
      margin: 14px 0 5px;
      font-size: 24px;
      letter-spacing: 1px;
      color: #d8a958;
    }

    .admin-header p {
      margin: 0;
      color: #a9a39a;
      font-size: 14px;
    }

    /* =========================
       Main
       ========================= */

    .admin-main {
      width: min(1100px, calc(100% - 28px));
      margin: 24px auto 60px;
    }

    /* =========================
       Connection status
       ========================= */

    .connection-box {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 13px 15px;
      margin-bottom: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.035);
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      flex: 0 0 10px;
      border-radius: 50%;
      background: #777;
    }

    .connection-box.success {
      border-color: rgba(52, 211, 153, 0.25);
      color: #baf3d7;
    }

    .connection-box.success .status-dot {
      background: #34d399;
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.7);
    }

    .connection-box.error {
      border-color: rgba(248, 113, 113, 0.3);
      color: #fecaca;
    }

    .connection-box.error .status-dot {
      background: #f87171;
    }

    /* =========================
       Statistics
       ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .stat-card {
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      border-radius: 18px;
      border: 1px solid rgba(201, 153, 76, 0.18);
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.055),
          rgba(255, 255, 255, 0.018)
        );
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.16);
    }

    .stat-card span {
      color: #aaa39a;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat-card strong {
      font-size: 30px;
      color: #e0b364;
      line-height: 1;
    }

    /* =========================
       Toolbar
       ========================= */

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .search-box {
      flex: 1;
      min-width: 190px;
      padding: 13px 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 13px;
      background: #0d0b09;
      color: white;
      outline: none;
    }

    .search-box:focus {
      border-color: rgba(216, 169, 88, 0.65);
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 12px 17px;
      font-weight: 700;
    }

    .btn-gold {
      color: #100b05;
      background: linear-gradient(135deg, #e2b55e, #ad7426);
    }

    .btn-dark {
      color: #e6e6e6;
      background: #17130f;
      border: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* =========================
       Sections
       ========================= */

    .panel {
      overflow: hidden;
      margin-bottom: 18px;
      border: 1px solid rgba(255, 255, 255, 0.075);
      border-radius: 18px;
      background: rgba(10, 8, 6, 0.84);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 17px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
      color: #dcb063;
    }

    .panel-body {
      padding: 15px;
    }

    /* =========================
       Category
       ========================= */

    .category-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      margin-bottom: 9px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.055);
    }

    .category-info {
      min-width: 0;
    }

    .category-name {
      font-weight: 700;
      color: #f1f1f1;
      margin-bottom: 4px;
    }

    .category-meta {
      color: #89847d;
      font-size: 12px;
    }

    .category-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-btn {
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #17130f;
      color: #d6d2cc;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
    }

    /* =========================
       Products
       ========================= */

    .product-row {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .product-row:last-child {
      border-bottom: 0;
    }

    .product-image {
      width: 58px;
      height: 58px;
      border-radius: 11px;
      object-fit: cover;
      background: #18130e;
    }

    .product-info {
      min-width: 0;
    }

    .product-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .product-meta {
      color: #8f8981;
      font-size: 12px;
    }

    .product-price {
      color: #d9aa57;
      font-weight: 800;
      white-space: nowrap;
      font-size: 13px;
    }

    .product-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 7px;
    }

    .product-options-preview {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .option-chip {
      font-size: 11px;
      color: #c9c2b8;
      border: 1px solid rgba(216, 169, 88, 0.18);
      background: rgba(216, 169, 88, 0.06);
      border-radius: 8px;
      padding: 4px 7px;
    }

    .edit-product-btn {
      border: 1px solid rgba(216, 169, 88, 0.28);
      background: #17130f;
      color: #e3c58e;
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12px;
    }

    /* =========================
       Empty / Loading
       ========================= */

    .loading,
    .empty {
      text-align: center;
      padding: 35px 15px;
      color: #8e8982;
    }

    /* =========================
       Responsive
       ========================= */

    @media (max-width: 650px) {

      .admin-main {
        width: min(100% - 20px, 1100px);
      }

      .stats {
        gap: 7px;
      }

      .stat-card {
        min-height: 88px;
        padding: 12px 9px;
        text-align: center;
      }

      .stat-card span {
        font-size: 11px;
      }

      .stat-card strong {
        font-size: 25px;
      }

      .panel-header {
        padding: 14px;
      }

      .panel-body {
        padding: 10px;
      }

      .category-row {
        padding: 12px 10px;
      }

    }

  

    /* ========================= Admin editor modal ========================= */
    .admin-modal{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:14px}
    .admin-modal.open{display:flex}.admin-modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0c0906;border:1px solid rgba(218,171,92,.38);border-radius:24px 24px 16px 16px;box-shadow:0 25px 80px rgba(0,0,0,.65);padding:20px}
    .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-20px;background:#0c0906;padding:4px 0 14px;z-index:2}.modal-head h2{margin:0;color:#e2b55e}.modal-close{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:#19130e;color:#fff;font-size:24px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:#b9b0a5}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(255,255,255,.11);background:#050403;color:#fff;border-radius:12px;padding:12px;outline:none}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c99545}
    .checks{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.check-card{display:flex;justify-content:center;align-items:center;gap:8px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:#13100d}.check-card input{width:19px;height:19px}
    .option-editor{border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px;margin-top:10px;background:#090705}.option-editor-grid{display:grid;grid-template-columns:1.4fr .8fr auto;gap:8px;align-items:end}.option-editor input{width:100%;border:1px solid rgba(255,255,255,.1);background:#030302;color:#fff;border-radius:10px;padding:10px}.danger-mini{border:1px solid rgba(248,113,113,.35);background:#251010;color:#fecaca;border-radius:10px;padding:10px 12px}.modal-actions{display:flex;gap:10px;position:sticky;bottom:-20px;background:#0c0906;padding:16px 0 4px;margin-top:14px}.modal-actions .btn{flex:1}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px}.msg.ok{display:block;background:#0d251b;color:#baf3d7;border:1px solid rgba(52,211,153,.3)}.msg.err{display:block;background:#2b1111;color:#fecaca;border:1px solid rgba(248,113,113,.3)}
    @media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.checks{grid-template-columns:1fr}.option-editor-grid{grid-template-columns:1fr 1fr}.option-editor-grid .danger-mini{grid-column:1/-1}.admin-modal{padding:0}.admin-modal-card{max-height:94vh;border-radius:24px 24px 0 0}}

.image-upload-box{grid-column:1/-1;border:1px dashed rgba(216,169,88,.38);background:rgba(216,169,88,.045);border-radius:16px;padding:14px}
.image-upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.image-upload-btn{display:inline-flex;padding:10px 15px;border-radius:11px;background:#17130f;border:1px solid rgba(216,169,88,.30);color:#e6c88f;font-weight:700;cursor:pointer}.image-upload-btn input{display:none}.image-preview{width:82px;height:82px;object-fit:cover;border-radius:13px}.image-file-name,.upload-progress{font-size:12px;color:#d8a958}
  </style>
</head>

<body>


<header class="admin-header">

  <img
    src="assets/shorash-logo.jpeg"
    alt="SHORASH"
    class="admin-logo"
  >

  <h1>SHORASH ADMIN</h1>

  <p>إدارة المنيو والأقسام والأصناف</p>

</header>


<main class="admin-main">


  <!-- Supabase connection -->
  <div id="connectionStatus" class="connection-box">

    <span class="status-dot"></span>

    <span id="connectionText">
      جاري الاتصال بقاعدة البيانات...
    </span>

  </div>


  <!-- Statistics -->
  <section class="stats">

    <div class="stat-card">
      <span>الأقسام</span>
      <strong id="categoryCount">—</strong>
    </div>

    <div class="stat-card">
      <span>الأصناف</span>
      <strong id="productCount">—</strong>
    </div>

    <div class="stat-card">
      <span>الخيارات</span>
      <strong id="optionCount">—</strong>
    </div>

  </section>


  <!-- Toolbar -->
  <div class="toolbar">

    <input
      id="adminSearch"
      class="search-box"
      type="search"
      placeholder="ابحث عن صنف..."
    >

    <button
      class="btn btn-gold"
      type="button"
      id="addProductBtn"
    >
      + إضافة صنف
    </button>

    <button
      class="btn btn-dark"
      type="button"
      id="refreshBtn"
    >
      تحديث
    </button>

  </div>


  <!-- Categories -->
  <section class="panel">

    <div class="panel-header">

      <h2>الأقسام</h2>

      <button
        id="addCategoryBtn"
        class="mini-btn"
        type="button"
      >
        + قسم جديد
      </button>

    </div>

    <div
      id="categoriesContainer"
      class="panel-body"
    >

      <div class="loading">
        جاري تحميل الأقسام...
      </div>

    </div>

  </section>


  <!-- Products -->
  <section class="panel">

    <div class="panel-header">

      <h2>الأصناف</h2>

      <span
        id="productsShown"
        style="color:#8f8981;font-size:12px;"
      ></span>

    </div>

    <div
      id="productsContainer"
      class="panel-body"
    >

      <div class="loading">
        جاري تحميل الأصناف...
      </div>

    </div>

  </section>


</main>



<div id="editorModal" class="admin-modal" aria-hidden="true">
  <div class="admin-modal-card">
    <div class="modal-head"><h2 id="editorTitle">تعديل الصنف</h2><button class="modal-close" type="button" onclick="closeAdminEditor()">×</button></div>
    <div id="editorBody"></div>
    <div id="editorMsg" class="msg"></div>
  </div>
</div>

<!-- Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Existing SHORASH Supabase Configuration -->
<script src="js/supabase-config.js?v=1.0"></script>


<script>

  let adminCategories = [];
  let adminProducts = [];
  let adminOptions = [];


  // ==========================================
  // Escape HTML
  // ==========================================

  function escapeAdminHtml(value) {

    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');

  }


  // ==========================================
  // Price
  // ==========================================

  function formatAdminPrice(value) {

    const number = Number(value || 0);

    return number.toLocaleString('en-US') + ' د.ع';

  }


  // ==========================================
  // Load dashboard
  // ==========================================

  async function loadAdminDashboard() {

    const status = document.getElementById('connectionStatus');
    const statusText = document.getElementById('connectionText');

    try {

      status.className = 'connection-box';

      statusText.textContent =
        'جاري الاتصال بقاعدة البيانات...';


      const [
        categoriesResult,
        productsResult,
        optionsResult
      ] = await Promise.all([

        supabaseClient
          .from('categories')
          .select('*')
          .order('sort_order', { ascending: true }),

        supabaseClient
          .from('products')
          .select('*')
          .order('sort_order', { ascending: true }),

        supabaseClient
          .from('product_options')
          .select('*')

      ]);


      if (categoriesResult.error) {
        throw categoriesResult.error;
      }

      if (productsResult.error) {
        throw productsResult.error;
      }

      if (optionsResult.error) {
        throw optionsResult.error;
      }


      adminCategories = categoriesResult.data || [];
      adminProducts = productsResult.data || [];
      adminOptions = optionsResult.data || [];


      status.className =
        'connection-box success';

      statusText.textContent =
        'متصل بقاعدة بيانات SHORASH';


      document.getElementById('categoryCount').textContent =
        adminCategories.length;

      document.getElementById('productCount').textContent =
        adminProducts.length;

      document.getElementById('optionCount').textContent =
        adminOptions.length;


      renderAdminCategories();
      renderAdminProducts();


      console.log(
        '✅ SHORASH ADMIN DATA LOADED',
        {
          categories: adminCategories.length,
          products: adminProducts.length,
          options: adminOptions.length
        }
      );

    }

    catch (error) {

      console.error(
        '❌ SHORASH ADMIN ERROR:',
        error
      );

      status.className =
        'connection-box error';

      statusText.textContent =
        'حدث خطأ أثناء تحميل قاعدة البيانات';

    }

  }


  // ==========================================
  // Categories
  // ==========================================

  function renderAdminCategories() {

    const container =
      document.getElementById('categoriesContainer');


    if (!adminCategories.length) {

      container.innerHTML =
        '<div class="empty">لا توجد أقسام.</div>';

      return;

    }


    container.innerHTML =
      adminCategories.map((category, index) => {

        const productCount =
          adminProducts.filter(
            product =>
              product.category_id === category.id
          ).length;


        const name =
          category.name_ar ||
          category.name ||
          'بدون اسم';


        return `
          <div class="category-row">

            <div class="category-info">

              <div class="category-name">
                ${escapeAdminHtml(name)}
              </div>

              <div class="category-meta">
                الترتيب ${index + 1}
                •
                ${productCount} صنف
              </div>

            </div>


            <div class="category-actions">

              <button
                class="mini-btn"
                type="button"
                onclick="editAdminCategory('${escapeAdminHtml(category.id)}')"
              >
                تعديل
              </button>

            </div>

          </div>
        `;

      }).join('');

  }


  // ==========================================
  // Products
  // ==========================================


  function getProductOptions(productId) {
    return adminOptions
      .filter(option => option.product_id === productId)
      .sort((a, b) => Number(a.sort_order || 0) - Number(b.sort_order || 0));
  }

  function getProductDisplayPrice(product) {
    const options = getProductOptions(product.id);
    const optionPrices = options
      .map(option => Number(option.price ?? option.base_price ?? 0))
      .filter(price => Number.isFinite(price) && price > 0);

    if (optionPrices.length) {
      const min = Math.min(...optionPrices);
      const max = Math.max(...optionPrices);
      return min === max
        ? formatAdminPrice(min)
        : `${formatAdminPrice(min)} — ${formatAdminPrice(max)}`;
    }

    return formatAdminPrice(product.base_price ?? product.price ?? 0);
  }

  function renderProductOptionChips(productId) {
    const options = getProductOptions(productId);
    if (!options.length) return '';

    return `
      <div class="product-options-preview">
        ${options.slice(0, 4).map(option => {
          const optionName =
            option.name_ar || option.name_ku || option.name_en ||
            option.label_ar || option.label_ku || option.label_en ||
            option.name || 'خيار';
          const price = Number(option.price ?? option.base_price ?? 0);
          return `<span class="option-chip">${escapeAdminHtml(optionName)}${price > 0 ? ` • ${formatAdminPrice(price)}` : ''}</span>`;
        }).join('')}
        ${options.length > 4 ? `<span class="option-chip">+${options.length - 4}</span>` : ''}
      </div>
    `;
  }

  function hasField(obj, key) { return Object.prototype.hasOwnProperty.call(obj || {}, key); }
  function firstExisting(obj, keys, fallback='') { for (const k of keys) if (hasField(obj,k)) return obj[k] ?? fallback; return fallback; }
  function fieldHtml(label, id, value='', type='text', full=false) {
    return `<div class="field ${full?'full':''}"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${escapeAdminHtml(value)}"></div>`;
  }
  function textAreaHtml(label,id,value='') { return `<div class="field full"><label for="${id}">${label}</label><textarea id="${id}">${escapeAdminHtml(value)}</textarea></div>`; }
  function closeAdminEditor(){ const m=document.getElementById('editorModal'); m.classList.remove('open'); m.setAttribute('aria-hidden','true'); document.body.style.overflow=''; }
  function openAdminEditor(title, html){ document.getElementById('editorTitle').textContent=title; document.getElementById('editorBody').innerHTML=html; const msg=document.getElementById('editorMsg'); msg.className='msg'; msg.textContent=''; const m=document.getElementById('editorModal'); m.classList.add('open'); m.setAttribute('aria-hidden','false'); document.body.style.overflow='hidden'; }
  function showEditorMsg(text, ok=false){ const m=document.getElementById('editorMsg'); m.textContent=text; m.className='msg '+(ok?'ok':'err'); }
  function val(id){ return document.getElementById(id)?.value ?? ''; }
  function checked(id){ return !!document.getElementById(id)?.checked; }

  function editAdminProduct(productId) {
    const product = adminProducts.find(item => String(item.id) === String(productId));
    if (!product) return;
    const options=getProductOptions(product.id);
    const catOptions=adminCategories.map(c=>`<option value="${escapeAdminHtml(c.id)}" ${String(c.id)===String(product.category_id)?'selected':''}>${escapeAdminHtml(c.name_ar||c.name||'بدون اسم')}</option>`).join('');
    const priceKey=hasField(product,'base_price')?'base_price':(hasField(product,'price')?'price':null);
    const html=`<div class="form-grid">
      ${fieldHtml('الاسم العربي','p_name_ar',firstExisting(product,['name_ar','name']))}
      ${fieldHtml('الاسم الكوردي','p_name_ku',firstExisting(product,['name_ku']))}
      ${fieldHtml('الاسم الإنجليزي','p_name_en',firstExisting(product,['name_en']))}
      <div class="field"><label>القسم</label><select id="p_category_id">${catOptions}</select></div>

  async function saveAdminProduct(productId){
    const product=adminProducts.find(x=>String(x.id)===String(productId));
    if(!product)return;

    const btn=document.getElementById('saveProductBtn');
    btn.disabled=true;
    btn.textContent='جاري الحفظ...';

    try{
      // 1) Upload new image if selected, otherwise use the URL field.
      const uploadedImageUrl=await uploadAdminProductImage(productId);

      const patch={};

      if(hasField(product,'name_ar')) patch.name_ar=val('p_name_ar');
      else if(hasField(product,'name')) patch.name=val('p_name_ar');

      if(hasField(product,'name_ku')) patch.name_ku=val('p_name_ku');
      if(hasField(product,'name_en')) patch.name_en=val('p_name_en');
      if(hasField(product,'category_id')) patch.category_id=val('p_category_id');

      const imageField = hasField(product,'image_url')
        ? 'image_url'
        : (hasField(product,'image') ? 'image' : null);

      if(imageField){
        patch[imageField]=uploadedImageUrl;
      }

      if(hasField(product,'base_price')) patch.base_price=Number(val('p_base_price')||0);
      else if(hasField(product,'price')) patch.price=Number(val('p_base_price')||0);

      if(hasField(product,'sort_order')) patch.sort_order=Number(val('p_sort_order')||0);

      ['description_ar','description_ku','description_en'].forEach(k=>{
        if(hasField(product,k)) patch[k]=val('p_'+k);
      });

      ['is_active','is_visible','is_available'].forEach(k=>{
        if(hasField(product,k)) patch[k]=checked('p_'+k);
      });

      if(hasField(product,'updated_at')){
        patch.updated_at=new Date().toISOString();
      }

      // 2) Update product. Do NOT chain .select() here.
      // Some RLS configurations can make UPDATE + SELECT look like 0 rows.
      const updateResult=await supabaseClient
        .from('products')
        .update(patch)
        .eq('id',product.id);

      if(updateResult.error) throw updateResult.error;

      // 3) Read the product again and verify the persisted values.
      const verify=await supabaseClient
        .from('products')
        .select('*')
        .eq('id',product.id)
        .single();

      if(verify.error) throw verify.error;
      if(!verify.data) throw new Error('تعذر قراءة الصنف بعد الحفظ.');

      if(imageField){
        const expected=String(uploadedImageUrl||'').trim();
        const actual=String(verify.data[imageField]||'').trim();

        if(expected !== actual){
          throw new Error(
            'لم يتم حفظ رابط الصورة في جدول products. ' +
            'الرابط الموجود حالياً: ' + (actual || 'فارغ')
          );
        }
      }

      // 4) Save product options.
      const rows=[...document.querySelectorAll('#optionsEditor .option-editor')];

      for(const row of rows){
        const oid=row.dataset.optionId;

        if(row.dataset.deleted==='1'){
          if(oid){
            const d=await supabaseClient
              .from('product_options')
              .delete()
              .eq('id',oid);

            if(d.error)throw d.error;
          }
          continue;
        }

        const name=row.querySelector('.oe-name').value.trim();
        const price=Number(row.querySelector('.oe-price').value||0);

        if(!name&&!oid)continue;

        if(oid){
          const old=adminOptions.find(o=>String(o.id)===String(oid))||{};
          const op={};

          if(hasField(old,'name_ar'))op.name_ar=name;
          else if(hasField(old,'label_ar'))op.label_ar=name;
          else if(hasField(old,'name'))op.name=name;

          if(hasField(old,'price'))op.price=price;
          else if(hasField(old,'base_price'))op.base_price=price;

          const r=await supabaseClient
            .from('product_options')
            .update(op)
            .eq('id',oid);

          if(r.error)throw r.error;

        } else {
          const sample=adminOptions[0]||{};
          const op={product_id:product.id};

          if(hasField(sample,'name_ar'))op.name_ar=name;
          else if(hasField(sample,'label_ar'))op.label_ar=name;
          else op.name_ar=name;

          if(hasField(sample,'price'))op.price=price;
          else if(hasField(sample,'base_price'))op.base_price=price;
          else op.price=price;

          if(hasField(sample,'sort_order')){
            op.sort_order=getProductOptions(product.id).length+1;
          }

          const r=await supabaseClient
            .from('product_options')
            .insert(op);

          if(r.error)throw r.error;
        }
      }

      showEditorMsg('تم حفظ الصنف والصورة والخيارات بنجاح ✓',true);

      await loadAdminDashboard();
      setTimeout(closeAdminEditor,850);

    }catch(e){
      console.error('SHORASH SAVE ERROR:',e);
      showEditorMsg('فشل الحفظ: '+(e.message||e));
    }finally{
      btn.disabled=false;
      btn.textContent='حفظ التعديلات';
    }
  }

  function uuidLike(value){
    return typeof value === 'string' &&
      /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(value);
  }

  function newUuid(){
    if(window.crypto?.randomUUID) return window.crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0;
      const v=c==='x'?r:(r&0x3|0x8);
      return v.toString(16);
    });
  }

  function getNextProductSortOrder(categoryId){
    const list=adminProducts.filter(p=>String(p.category_id)===String(categoryId));
    if(!list.length) return 1;
    return Math.max(...list.map(p=>Number(p.sort_order||0)))+1;
  }

  async function uploadNewProductImage(productId){
    const input=document.getElementById('np_image_file');
    const file=input?.files?.[0];
    if(!file) return val('np_image_url').trim();

    if(!file.type.startsWith('image/')) throw new Error('الملف المختار ليس صورة.');
    if(file.size>10*1024*1024) throw new Error('حجم الصورة أكبر من 10MB.');

    const progress=document.getElementById('np_upload_progress');
    if(progress) progress.textContent='جاري رفع الصورة...';

    const ext=({'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif'})[file.type]||'jpg';
    const path=`products/${String(productId).replace(/[^a-zA-Z0-9_-]/g,'_')}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

    const upload=await supabaseClient.storage
      .from('menu-images')
      .upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});

    if(upload.error) throw upload.error;

    const result=supabaseClient.storage.from('menu-images').getPublicUrl(path);
    const publicUrl=result?.data?.publicUrl;
    if(!publicUrl) throw new Error('تم رفع الصورة لكن تعذر إنشاء رابطها العام.');

    const urlInput=document.getElementById('np_image_url');
    if(urlInput) urlInput.value=publicUrl;
    if(progress) progress.textContent='تم رفع الصورة ✓';

    return publicUrl;
  }

  function buildNewOptionPayload(productId,name,price,index){
    const sample=adminOptions[0]||{};
    const op={product_id:productId};

    if(uuidLike(sample.id)) op.id=newUuid();

    if(hasField(sample,'name_ar')) op.name_ar=name;
    else if(hasField(sample,'label_ar')) op.label_ar=name;
    else if(hasField(sample,'name')) op.name=name;
    else op.name_ar=name;

    if(hasField(sample,'name_ku')) op.name_ku=name;
    if(hasField(sample,'name_en')) op.name_en=name;

    if(hasField(sample,'price')) op.price=price;
    else if(hasField(sample,'base_price')) op.base_price=price;
    else op.price=price;

    if(hasField(sample,'sort_order')) op.sort_order=index+1;
    if(hasField(sample,'is_active')) op.is_active=true;
    if(hasField(sample,'is_visible')) op.is_visible=true;
    if(hasField(sample,'is_available')) op.is_available=true;
    if(hasField(sample,'created_at')) op.created_at=new Date().toISOString();
    if(hasField(sample,'updated_at')) op.updated_at=new Date().toISOString();

    return op;
  }

  async function createAdminProduct(){
    const sample=adminProducts[0]||{};
    const btn=document.getElementById('createProductBtn');
    const nameAr=val('np_name_ar').trim();
    const categoryId=val('np_category_id');

    if(!nameAr){
      showEditorMsg('اكتب الاسم العربي للصنف أولاً.');
      return;
    }
    if(!categoryId){
      showEditorMsg('اختر القسم أولاً.');
      return;
    }

    btn.disabled=true;
    btn.textContent='جاري الإضافة...';

    try{
      const newId=uuidLike(sample.id)?newUuid():newUuid();
      const imageUrl=await uploadNewProductImage(newId);
      const basePrice=Number(val('np_base_price')||0);

      const insert={};

      // ID is UUID in the current SHORASH products table.
      insert.id=newId;

      if(hasField(sample,'category_id')) insert.category_id=categoryId;
      if(hasField(sample,'name_ar')) insert.name_ar=nameAr;
      else if(hasField(sample,'name')) insert.name=nameAr;

      if(hasField(sample,'name_ku')) insert.name_ku=val('np_name_ku').trim()||nameAr;
      if(hasField(sample,'name_en')) insert.name_en=val('np_name_en').trim()||nameAr;

      if(hasField(sample,'description_ar')) insert.description_ar=val('np_description_ar').trim();
      if(hasField(sample,'description_ku')) insert.description_ku=val('np_description_ku').trim();
      if(hasField(sample,'description_en')) insert.description_en=val('np_description_en').trim();

      if(hasField(sample,'image_url')) insert.image_url=imageUrl||null;
      else if(hasField(sample,'image')) insert.image=imageUrl||null;

      if(hasField(sample,'base_price')) insert.base_price=basePrice;
      else if(hasField(sample,'price')) insert.price=basePrice;

      if(hasField(sample,'sort_order')) insert.sort_order=Number(val('np_sort_order')||getNextProductSortOrder(categoryId));

      if(hasField(sample,'is_active')) insert.is_active=checked('np_is_active');
      if(hasField(sample,'is_visible')) insert.is_visible=checked('np_is_visible');
      if(hasField(sample,'is_available')) insert.is_available=checked('np_is_available');

      const optionRows=[...document.querySelectorAll('#newOptionsEditor .option-editor')]
        .map(row=>({
          name:row.querySelector('.noe-name')?.value.trim()||'',
          price:Number(row.querySelector('.noe-price')?.value||0)
        }))
        .filter(row=>row.name);

      if(hasField(sample,'has_options')) insert.has_options=optionRows.length>1;

      // Keep badge defaults safe if the columns exist.
      ['is_popular','is_new','is_hot','is_offer'].forEach(k=>{
        if(hasField(sample,k)) insert[k]=false;
      });

      const now=new Date().toISOString();
      if(hasField(sample,'created_at')) insert.created_at=now;
      if(hasField(sample,'updated_at')) insert.updated_at=now;

      const created=await supabaseClient
        .from('products')
        .insert(insert);

      if(created.error) throw created.error;

      // If no explicit option was entered, create a single direct-add option.
      const optionsToCreate=optionRows.length
        ? optionRows
        : [{name:nameAr,price:basePrice}];

      for(let i=0;i<optionsToCreate.length;i++){
        const option=optionsToCreate[i];
        const payload=buildNewOptionPayload(newId,option.name,option.price,i);

        const r=await supabaseClient
          .from('product_options')
          .insert(payload);

        if(r.error) throw r.error;
      }

      // Verify the new product is readable.
      const verify=await supabaseClient
        .from('products')
        .select('*')
        .eq('id',newId)
        .single();

      if(verify.error) throw verify.error;

      showEditorMsg('تمت إضافة الصنف بنجاح ✓',true);
      await loadAdminDashboard();
      setTimeout(closeAdminEditor,900);

    }catch(e){
      console.error('CREATE PRODUCT ERROR:',e);
      showEditorMsg('فشل إضافة الصنف: '+(e.message||e));
    }finally{
      btn.disabled=false;
      btn.textContent='إضافة الصنف';
    }
  }

    openAdminEditor('تعديل القسم',`<div class="form-grid">${fieldHtml('الاسم العربي','c_name_ar',firstExisting(c,['name_ar','name']))}${hasField(c,'name_ku')?fieldHtml('الاسم الكوردي','c_name_ku',c.name_ku||''):''}${hasField(c,'name_en')?fieldHtml('الاسم الإنجليزي','c_name_en',c.name_en||''):''}${hasField(c,'sort_order')?fieldHtml('الترتيب','c_sort_order',c.sort_order??0,'number'):''}</div><div class="checks">${hasField(c,'is_active')?`<label class="check-card"><input id="c_is_active" type="checkbox" ${c.is_active?'checked':''}> فعال</label>`:''}${hasField(c,'is_visible')?`<label class="check-card"><input id="c_is_visible" type="checkbox" ${c.is_visible?'checked':''}> ظاهر</label>`:''}</div><div class="modal-actions"><button class="btn btn-dark" onclick="closeAdminEditor()">إلغاء</button><button class="btn btn-gold" id="saveCategoryBtn" onclick="saveAdminCategory('${escapeAdminHtml(c.id)}')">حفظ القسم</button></div>`);
  }
  async function saveAdminCategory(id){const c=adminCategories.find(x=>String(x.id)===String(id));const p={};if(hasField(c,'name_ar'))p.name_ar=val('c_name_ar');else if(hasField(c,'name'))p.name=val('c_name_ar');if(hasField(c,'name_ku'))p.name_ku=val('c_name_ku');if(hasField(c,'name_en'))p.name_en=val('c_name_en');if(hasField(c,'sort_order'))p.sort_order=Number(val('c_sort_order')||0);if(hasField(c,'is_active'))p.is_active=checked('c_is_active');if(hasField(c,'is_visible'))p.is_visible=checked('c_is_visible');const b=document.getElementById('saveCategoryBtn');b.disabled=true;try{const r=await supabaseClient.from('categories').update(p).eq('id',id);if(r.error)throw r.error;showEditorMsg('تم حفظ القسم ✓',true);await loadAdminDashboard();setTimeout(closeAdminEditor,600)}catch(e){showEditorMsg('فشل الحفظ: '+e.message)}finally{b.disabled=false}}



  function renderAdminProducts(search = '') {

    const container =
      document.getElementById('productsContainer');


    const query =
      String(search || '')
        .trim()
        .toLowerCase();


    const filtered =
      adminProducts.filter(product => {

        if (!query) return true;


        const text = [
          product.name_ar,
          product.name_en,
          product.name_ku,
          product.description_ar
        ]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();


        return text.includes(query);

      });


    document.getElementById('productsShown').textContent =
      `${filtered.length} من ${adminProducts.length}`;


    if (!filtered.length) {

      container.innerHTML =
        '<div class="empty">لا توجد نتائج.</div>';

      return;

    }


    container.innerHTML =
      filtered.map(product => {

        const name =
          product.name_ar ||
          product.name ||
          'بدون اسم';


        const category =
          adminCategories.find(
            item => item.id === product.category_id
          );


        const categoryName =
          category
            ? (
                category.name_ar ||
                category.name ||
                ''
              )
            : 'بدون قسم';


        const image =
          product.image_url ||
          product.image ||
          'assets/shorash-logo.jpeg';


        return `
          <div class="product-row">

            <img
              class="product-image"
              src="${escapeAdminHtml(image)}"
              alt=""
              loading="lazy"
              onerror="
                this.onerror=null;
                this.src='assets/shorash-logo.jpeg';
              "
            >


            <div class="product-info">

              <div class="product-name">
                ${escapeAdminHtml(name)}
              </div>

              <div class="product-meta">
                ${escapeAdminHtml(categoryName)}
              </div>

              ${renderProductOptionChips(product.id)}

            </div>


            <div class="product-side">
              <div class="product-price">
                ${getProductDisplayPrice(product)}
              </div>

              <button
                class="edit-product-btn"
                type="button"
                onclick="editAdminProduct('${escapeAdminHtml(product.id)}')"
              >
                تعديل
              </button>
            </div>

          </div>
        `;

      }).join('');

  }


  // ==========================================
  // Search
  // ==========================================

  document
    .getElementById('adminSearch')
    .addEventListener('input', event => {

      renderAdminProducts(
        event.target.value
      );

    });


  // ==========================================
  // Refresh
  // ==========================================

  document
    .getElementById('refreshBtn')
    .addEventListener('click', () => {

      loadAdminDashboard();

    });


  // Add buttons: editors will be enabled after edit/save is verified.
  document.getElementById('addProductBtn').addEventListener('click',openAddProductEditor);
  document.getElementById('addCategoryBtn').addEventListener('click',()=>alert('أولاً جرّب تعديل قسم وحفظه. بعد نجاحه نفعّل إضافة قسم.'));
  document.getElementById('editorModal').addEventListener('click',e=>{if(e.target.id==='editorModal')closeAdminEditor();});


  // ==========================================
  // Start
  // ==========================================

  loadAdminDashboard();

</script>
