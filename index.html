<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080604">

  <title>SHORASH REST & CAFE</title>

  <!-- SHORASH Favicon -->
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="css/style.css?v=4.0">
  <link rel="stylesheet" href="css/cart.css?v=3.0">
</head>

<body>

  <!-- Background video -->
  <video
    id="smBgVideo"
    class="sm-bg-video"
    autoplay
    muted
    loop
    playsinline>
  </video>

  <div class="sm-bg-overlay"></div>


  <!-- Intro -->
  <div id="smIntro" class="sm-intro">

    <div class="sm-intro-logo-wrap">
      <img
        src="assets/shorash-logo.jpeg"
        alt="SHORASH"
        class="sm-intro-logo">
    </div>

    <div class="sm-intro-brand">
      SHORASH
    </div>

    <div class="sm-intro-sub">
      REST &amp; CAFE
    </div>

  </div>


  <!-- Main page -->
  <main id="smApp" class="sm-app">

    <header class="sm-header">

      <div class="sm-logo-wrap">
        <img
          src="assets/shorash-logo.jpeg"
          alt="SHORASH Logo"
          class="sm-logo">
      </div>

      <h1>SHORASH MENU</h1>

      <p id="smSubtitle">
        اكتشف منيو شوراش
      </p>

      <div id="smLangs" class="sm-langs"></div>

      <div id="smActions" class="sm-actions"></div>

    </header>


    <!-- Sticky category navigation -->
    <div class="sm-cats-wrap">

      <div id="smCats" class="sm-cats"></div>

      <div id="smProgress" class="sm-progress">
        <span></span>
      </div>

    </div>

    <div id="smCatsSentinel"></div>


    <!-- Menu -->
    <section id="smMenu" class="sm-menu"></section>


    <!-- Footer -->
    <footer class="sm-footer">

      <div class="sm-footer-card">

        <div class="sm-footer-line"></div>

        <h2>SHORASH REST &amp; CAFE</h2>

        <p class="sm-footer-location">
          Duhok • Kurdistan
        </p>


        <div class="sm-footer-main-actions">

          <a id="smFooterLocation" href="#" target="_blank">
            موقعنا
          </a>

          <a id="smFooterCall" href="#">
            اتصال
          </a>

          <a id="smFooterWhatsapp" href="#" target="_blank">
            WhatsApp Menu
          </a>

        </div>


        <div class="sm-footer-socials">

          <a id="smFacebook" href="#" target="_blank">
            Facebook
          </a>

          <a id="smSnapchat" href="#" target="_blank">
            Snapchat
          </a>

          <a id="smTikTok" href="#" target="_blank">
            TikTok
          </a>

          <a id="smInstagram" href="#" target="_blank">
            Instagram
          </a>

        </div>


        <div class="sm-footer-phone">
          +964 750 266 2002
        </div>

        <div class="sm-footer-copy">
          SHORASH — All Rights Reserved 2026 ©
        </div>

      </div>

    </footer>

  </main>


  <!-- Back to top -->
  <button
    id="smTopBtn"
    class="sm-top-btn"
    type="button"
    aria-label="Back to top">
    ↑
  </button>


  <!-- ==========================================
       SUPABASE
       Must load before app.js and cart.js
       ========================================== -->

  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SHORASH Supabase Configuration -->
  <script src="js/supabase-config.js?v=1.0"></script>


  <!-- SHORASH Application -->
  <script src="js/app.js?v=10.0"></script>

  <!-- SHORASH Cart -->
  <script src="js/cart.js?v=3.5"></script>


</body>
</html>
